<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tebak Angka</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎮 Tebak Angka</h1>

        <p>Aku sudah memilih angka dari 1 sampai 100!</p>
        <p>Coba tebak angkanya 😆</p>

        <div class="input-area">

            <input 
                type="number" 
                id="guessInput"
                placeholder="Masukkan angka"
            >

            <button onclick="checkGuess()">
                Tebak
            </button>

        </div>

        <p id="result"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
